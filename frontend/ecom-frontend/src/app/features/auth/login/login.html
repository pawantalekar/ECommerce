<div class="page-wrapper">
  <div class="auth-card" role="main" aria-labelledby="login-heading">
    <div class="brand">
      <img src="assets/logo.png" alt="Ecom logo" class="brand-logo" />
      <h1 id="login-heading" class="brand-title">Ecom</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form" novalidate>
      <div class="field">
        <label for="username">Email or Username</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>

      <div class="controls">
        <label class="remember">
          <input type="checkbox" formControlName="remember" /> Remember me
        </label>
        <a class="forgot" (click)="onForgot()" role="button">Forgot?</a>
      </div>

      <button class="primary" type="submit" disabled aria-disabled="true"
        title="Username/password login not implemented">
        Log in
      </button>

      <div class="divider"><span>or</span></div>

      <button type="button" class="google" (click)="loginWithGoogle()" aria-label="Sign in with Google">
        <span class="g-icon" aria-hidden="true">G</span>
        <span>Sign in with Google</span>
      </button>

      <div class="signup">
        <span>New to Ecom?</span>
        <a routerLink="/auth/register">Create an account</a>
      </div>

      <div *ngIf="error" class="submit-error" role="alert">{{ error }}</div>
    </form>
  </div>
</div>
