<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
    <div class="card shadow border-0" style="max-width: 420px; width: 100%;">
      <div class="card-body p-5">
  
        <div class="text-center mb-5">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3"
            style="width: 70px; height: 70px;">
            <i class="bi bi-bag-fill fs-3"></i>
          </div>
          <h1 class="h3 fw-bold text-dark mb-0">Ecom</h1>
        </div>
  
        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  
          <div class="mb-3">
            <label for="username" class="form-label fw-medium">Email or Username</label>
            <input id="username" type="text" formControlName="username" class="form-control" autocomplete="username"
              placeholder="Enter email or username">
          </div>
  
          <div class="mb-3">
            <label for="password" class="form-label fw-medium">Password</label>
            <input id="password" type="password" formControlName="password" class="form-control"
              autocomplete="current-password" placeholder="Enter password">
          </div>
  
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" formControlName="remember">
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <a href="#" class="text-primary text-decoration-none small" (click)="onForgot()">Forgot?</a>
          </div>
  
          <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" [disabled]="true"
            title="Username/password login not implemented">
            Log in
          </button>
  
          <div class="d-flex align-items-center my-4">
            <hr class="flex-grow-1">
            <span class="px-3 text-muted small">or</span>
            <hr class="flex-grow-1">
          </div>
  
          <button type="button"
            class="btn btn-outline-danger btn-lg w-100 d-flex align-items-center justify-content-center gap-2 mb-3"
            (click)="loginWithGoogle()">
            <span class="fw-bold">G</span>
            <span>Sign in with Google</span>
          </button>
  
          <div class="text-center">
            <span class="text-muted">New to Ecom?</span>
            <a routerLink="/auth/register" class="text-primary text-decoration-none fw-medium ms-1">
              Create an account
            </a>
          </div>
  
          <div *ngIf="error" class="alert alert-danger mt-4" role="alert">
            {{ error }}
          </div>
  
        </form>
      </div>
    </div>
  </div>
</body>
</html>
