<div class="container py-5">
  <h2 class="mb-4">My Orders</h2>

  @for (order of orders; track order) {
    <div class="card mb-3 shadow-sm border-0 rounded-3">
      <div class="row g-0 align-items-center">
        <div class="col-3 col-md-2 col-lg-1">
          <div class="p-2">
            <img [src]="order.items[0]?.thumbnailUrl || 'https://via.placeholder.com/100'"
              class="img-fluid rounded w-100" style="height: 80px; object-fit: cover;" alt="Product">
            </div>
          </div>
          <div class="col-9 col-md-10 col-lg-11">
            <div class="card-body py-4 px-4">
              <div class="row align-items-center g-3">
                <div class="col-lg-5">
                  <h5 class="mb-1 fw-bold">{{ order.items[0]?.productName }}</h5>
                  <p class="text-muted small mb-0">
                    <strong>Order:</strong> {{ order.orderNumber }}
                    <span class="mx-2">•</span>
                    {{ order.createdAt | date:'dd MMM yyyy' }}
                  </p>
                </div>
                <div class="col-lg-2 text-center">
                  <h5 class="mb-0 text-primary fw-bold">₹{{ order.totalAmount }}</h5>
                </div>
                <div class="col-lg-3 text-center">
                            <span class="badge fs-6 px-4 py-2" [ngClass]="{
                      'bg-success': order.paymentStatus === 'Paid',
                      'bg-danger': order.paymentStatus === 'Failed',
                      'bg-warning text-dark': order.paymentStatus === 'Pending'
                    }">
                    {{ order.paymentStatus }}
                  </span>
                </div>
                <div class="col-lg-2 text-end">
                  <button class="btn btn-outline-primary btn-sm px-4" (click)="viewDetail(order.id)">
                    View Details
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    }

    @if (orders.length === 0) {
      <div class="text-center py-5 text-muted">
        <i class="bi bi-receipt display-1"></i>
        <h4 class="mt-3">No orders yet</h4>
        <a routerLink="/catalog" class="btn btn-primary mt-3">Start Shopping</a>
      </div>
    }
  </div>
