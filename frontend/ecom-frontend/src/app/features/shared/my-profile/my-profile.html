<p-toast></p-toast>
<div class="container-fluid mt-3">
    <div class="row g-3">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-3">
            <div class="profile-card card border-0 h-100">
                <div class="card-body d-flex flex-column text-center p-3">
                    <div class="mb-3 avatar-container mx-auto">
                        <svg width="80" height="80" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"
                            class="profile-avatar">
                            <circle cx="60" cy="60" r="60" fill="#e3f2fd" />
                            <circle cx="60" cy="44" r="24" fill="#1e293b" />
                            <path d="M60 80C38 80 20 98 20 120H100C100 98 82 80 60 80Z" fill="#1e293b" />
                            <circle cx="60" cy="44" r="16" fill="#f8fafc" />
                        </svg>
                    </div>

                    <h6 class="profile-name mb-1">
                        {{ (userProfile?.firstName || 'User') + ' ' + (userProfile?.lastName || '') }}
                    </h6>
                    <p class="profile-email mb-3">{{ userProfile?.email || 'No email provided' }}</p>

                    <div class="divider my-3"></div>

                    <ul class="nav flex-column gap-1 nav-pills">
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center" routerLink="/profile"
                                routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                                <i class="bi bi-person-fill me-3"></i>
                                <span>Profile</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center" routerLink="addresses"
                                routerLinkActive="active">
                                <i class="bi bi-geo-alt-fill me-3"></i>
                                <span>Addresses</span>
                            </a>
                        </li>
                        <li class="nav-item mt-auto pt-2">
                            <a class="nav-link d-flex align-items-center text-danger logout-link" routerLink="/login"
                                (click)="logout()">
                                <i class="bi bi-box-arrow-right me-3"></i>
                                <span>Log Out</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-9 col-lg-9">
            <div class="content-area">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
