<p-toast></p-toast>
<div class="container-fluid mt-4">
    <div class="row g-4">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-3 mb-4 mb-md-0">
            <div class="card shadow-lg border-0 h-100 rounded-4 overflow-hidden">
                <div class="card-body d-flex flex-column text-center p-4">
                    <div class="mb-4">
                        <svg width="120" height="120" viewBox="0 0 120 120" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <circle cx="60" cy="60" r="60" fill="#e3f2fd" />
                            <circle cx="60" cy="44" r="24" fill="#1976d2" />
                            <path d="M60 80C38 80 20 98 20 120H100C100 98 82 80 60 80Z" fill="#1976d2" />
                            <circle cx="60" cy="44" r="16" fill="#bbdefb" />
                        </svg>
                    </div>

                    <h5 class="card-title mb-1 fw-bold fs-4 text-dark">
                        {{ (userProfile?.firstName || 'User') + ' ' + (userProfile?.lastName || '') }}
                    </h5>
                    <p class="text-muted small mb-4">{{ userProfile?.email || 'No email provided' }}</p>

                    <hr class="my-4 border-secondary-subtle">

                    <ul class="nav flex-column gap-2">
                        <li class="nav-item">
                            <a class="nav-link active d-flex align-items-center fw-semibold py-3 px-3 rounded-3 bg-primary bg-opacity-10 text-primary"
                                routerLink="/profile">
                                <i class="bi bi-person-fill fs-5 me-3"></i>
                                Profile
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center text-dark py-3 px-3 rounded-3 hover-bg-light"
                               routerLink="addresses">
                                <i class="bi bi-house-door-fill fs-5 me-3 text-secondary"></i>
                                Addresses
                            </a>
                        </li>
                        <li class="nav-item mt-auto">
                            <a class="nav-link d-flex align-items-center text-danger py-3 px-3 rounded-3 hover-bg-danger"
                                routerLink="/login" (click)="logout()">
                                <i class="bi bi-box-arrow-right fs-5 me-3"></i>
                                Log Out
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-9 col-lg-9">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>

<style>
    .bg-gradient-primary {
        background: linear-gradient(90deg, #0d6efd, #0b5ed7);
    }

    .hover-bg-light:hover {
        background-color: #f8f9fa !important;
    }

    .hover-bg-danger:hover {
        background-color: #f8d7da !important;
    }

    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
</style>
