<div class="card profile-details-card border-0 rounded-4 overflow-hidden h-100">
    <div class="profile-card-header text-white py-3 px-4 border-0">
        <h6 class="mb-0 fw-semibold">My Profile</h6>
    </div>

    <div class="card-body p-4">
        <div *ngIf="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div *ngIf="error && !loading" class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" (click)="error = undefined"></button>
        </div>

        <div *ngIf="userProfile && !loading">
            <form #profileForm="ngForm" (ngSubmit)="updateProfile(profileForm)">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted mb-1">First Name</label>
                        <input type="text" class="form-control rounded-3" [(ngModel)]="updateCommand.firstName"
                            name="firstName" required maxlength="50" pattern="[A-Za-z\s]+"
                            (keypress)="onlyLetters($event)" (input)="sanitizeName($event)" #firstNameCtrl="ngModel">
                        <div *ngIf="firstNameCtrl.invalid && (firstNameCtrl.dirty || firstNameCtrl.touched)"
                            class="text-danger small mt-1">
                            <div *ngIf="firstNameCtrl.errors?.['required']">First name is required</div>
                            <div *ngIf="firstNameCtrl.errors?.['maxlength']">Maximum 50 characters allowed</div>
                            <div *ngIf="firstNameCtrl.errors?.['pattern']">Only letters and spaces allowed</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted mb-1">Last Name</label>
                        <input type="text" class="form-control rounded-3" [(ngModel)]="updateCommand.lastName"
                            name="lastName" required maxlength="50" pattern="[A-Za-z\s]+"
                            (keypress)="onlyLetters($event)" (input)="sanitizeName($event)" #lastNameCtrl="ngModel">
                        <div *ngIf="lastNameCtrl.invalid && (lastNameCtrl.dirty || lastNameCtrl.touched)"
                            class="text-danger small mt-1">
                            <div *ngIf="lastNameCtrl.errors?.['required']">Last name is required</div>
                            <div *ngIf="lastNameCtrl.errors?.['maxlength']">Maximum 50 characters allowed</div>
                            <div *ngIf="lastNameCtrl.errors?.['pattern']">Only letters and spaces allowed</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted mb-1">Gender</label>
                        <select class="form-select rounded-3" [(ngModel)]="updateCommand.gender" name="gender">
                            <option value="">Prefer not to say</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted mb-1">Mobile Number</label>
                        <input type="tel" class="form-control rounded-3" [(ngModel)]="updateCommand.mobileNumber"
                            name="mobileNumber" required pattern="^[0-9]{10}$" maxlength="10"
                            (keypress)="onlyNumbers($event)" (input)="limitTo10Digits($event)" #mobileCtrl="ngModel">
                        <div *ngIf="mobileCtrl.invalid && (mobileCtrl.dirty || mobileCtrl.touched)"
                            class="text-danger small mt-1">
                            <div *ngIf="mobileCtrl.errors?.['required']">Mobile number is required</div>
                            <div *ngIf="mobileCtrl.errors?.['pattern']">Exactly 10 digits required</div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted mb-1">Email</label>
                        <input type="email" class="form-control rounded-3 bg-light" [value]="userProfile.email"
                            disabled>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-muted mb-1">Role</label>
                        <input type="text" class="form-control rounded-3 bg-light" [value]="userProfile.role" disabled>
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-medium update-btn"
                        [disabled]="loading || profileForm.invalid || !hasChanges()">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
                        {{ loading ? 'Updating...' : 'Update Profile' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
