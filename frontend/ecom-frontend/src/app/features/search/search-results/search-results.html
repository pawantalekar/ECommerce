<div class="container py-5">
    <h2>Search results for "{{ query }}" ({{ total }} found)</h2>

    <div *ngIf="loading">Loading...</div>

    <ul *ngIf="!loading">
        <li *ngFor="let p of products">
            {{ p.name }} - ₹{{ p.price }}
            <a [routerLink]="['/catalog/products', p.slug]">View →</a>
        </li>
    </ul>

    <div *ngIf="!loading && products.length === 0">
        No products found
    </div>
</div>
