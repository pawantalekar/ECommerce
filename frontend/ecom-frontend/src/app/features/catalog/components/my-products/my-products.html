<!-- my-products.component.html -->
<div class="container py-5">
    <h2 class="mb-4 fw-bold">My Products</h2>

    @if (loading) {
    <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading your products...</p>
    </div>
    }

    @else if (error) {
    <div class="alert alert-danger" role="alert">
        {{ error }}
        <button class="btn btn-outline-danger btn-sm ms-3" (click)="loadMyProducts()">Retry</button>
    </div>
    }

    @else if (products.length === 0) {
    <div class="text-center py-5">
        <p class="text-muted fs-5">You haven't added any products yet.</p>
        <a routerLink="/seller/add-product" class="btn btn-primary">Add Your First Product</a>
    </div>
    }

    @else {
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
        @for (product of products; track product.id) {
        <div class="col">
            <app-product-card [product]="asProduct(product)"></app-product-card>
        </div>
        }
    </div>
    }
</div>
