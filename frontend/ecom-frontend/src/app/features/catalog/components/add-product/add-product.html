<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <h2 class="mb-4 text-center">Add New Product</h2>

        <div class="product-card">
          @if (error) {
          <div class="alert alert-danger">
            <i class="bi bi-exclamation-circle me-2"></i>
            {{ error }}
          </div>
          }

          <form (ngSubmit)="onSubmit()" #form="ngForm" novalidate>

            <div class="row g-4 mb-4">
              <div class="col-md-6">
                <label class="form-label">Name <span class="text-danger">*</span></label>
                <input [(ngModel)]="model.name" name="name" required class="form-control"
                  placeholder="e.g. Apple iPhone 16" />
              </div>
              <div class="col-md-6">
                <label class="form-label">SKU <span class="text-danger">*</span></label>
                <input [(ngModel)]="model.sku" name="sku" required class="form-control"
                  placeholder="e.g. APL-IP16-128BLK" />
              </div>
            </div>

            <div class="row g-4 mb-4">
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <select class="form-control" (change)="onCategoryChange($event)" [ngModel]="selectedCategoryId"
                  name="categorySelect">
                  <option value="">Select Category</option>
                  <option value="new">+ Add New Category</option>
                  <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
                </select>
                <input *ngIf="showNewCategoryInput" [(ngModel)]="model.categoryName" name="categoryName"
                  class="form-control mt-2" placeholder="Enter new category name" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Brand</label>
                <select class="form-control" (change)="onBrandChange($event)" [ngModel]="selectedBrandId"
                  name="brandSelect">
                  <option value="">Select Brand</option>
                  <option value="new">+ Add New Brand</option>
                  <option *ngFor="let brand of brands" [value]="brand.id">{{ brand.name }}</option>
                </select>
                <input *ngIf="showNewBrandInput" [(ngModel)]="model.brandName" name="brandName"
                  class="form-control mt-2" placeholder="Enter new brand name" />
              </div>
            </div>

            <div class="row g-4 mb-4">
              <div class="col-md-6">
                <label class="form-label">Category Slug <span class="text-muted d-inline">(Optional)</span></label>
                <input [(ngModel)]="model.categorySlug" name="categorySlug" class="form-control"
                  placeholder="e.g. smartphones" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Brand Logo URL <span class="text-muted d-inline">(Optional)</span></label>
                <input [(ngModel)]="model.brandLogoUrl" name="brandLogoUrl" class="form-control"
                  placeholder="https://example.com/logo.png" />
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Short Description</label>
              <textarea [(ngModel)]="model.shortDescription" name="shortDesc" class="form-control" rows="2"
                placeholder="Brief summary of the product..."></textarea>
            </div>

            <div class="mb-4">
              <label class="form-label">Full Description</label>
              <textarea [(ngModel)]="model.description" name="desc" class="form-control" rows="5"
                placeholder="Detailed product specifications and features..."></textarea>
            </div>

            <div class="row g-4 mb-4">
              <div class="col-md-6">
                <label class="form-label">Price (₹) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input [(ngModel)]="model.price" name="price" type="number" required min="1" class="form-control"
                    placeholder="0.00" />
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Stock Quantity <span class="text-danger">*</span></label>
                <input [(ngModel)]="model.stockQuantity" name="stock" type="number" required min="1"
                  class="form-control" placeholder="0" />
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Product Images</label>
              <input type="file" multiple accept="image/*" (change)="onFileChange($event)" class="form-control" />
              <small class="text-muted">Supported formats: JPG, PNG, WEBP. Images will be prioritized by upload
                order.</small>
            </div>

            <div class="mb-5">
              <label class="form-label">Tags</label>
              <input [(ngModel)]="tagInput" name="tags" placeholder="e.g. mobile, 5g, premium (comma separated)"
                class="form-control" />
            </div>

            <div class="row pt-3">
              <div class="col-md-8 mx-auto d-flex gap-3">
                <button type="submit" class="btn btn-primary flex-grow-1" [disabled]="uploading || !form.valid">
                  @if(uploading) {
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Publishing...
                  } @else {
                  Publish Product
                  }
                </button>
                <a [routerLink]="['/home']" class="btn btn-secondary flex-grow-1">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
