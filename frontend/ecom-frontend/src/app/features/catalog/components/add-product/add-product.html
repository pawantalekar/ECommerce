<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h2 class="mb-4 text-center">Add New Product</h2>

          @if (error) {
            <div class="alert alert-danger">{{ error }}</div>
          }

          <form (ngSubmit)="onSubmit()" #form="ngForm" novalidate>


            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label">Name *</label>
                <input [(ngModel)]="model.name" name="name" required class="form-control"
                  placeholder="Apple iPhone 16" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">SKU *</label>
                  <input [(ngModel)]="model.sku" name="sku" required class="form-control"
                    placeholder="APL-IP16-128BLK" />
                  </div>
                </div>


                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <select class="form-control" (change)="onCategoryChange($event)" [ngModel]="selectedCategoryId" name="categorySelect">
                      <option value="">Select Category</option>
                      <option value="new">Add new...</option>
                      <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
                    </select>
                    <input *ngIf="showNewCategoryInput" [(ngModel)]="model.categoryName" name="categoryName" class="form-control"
                      placeholder="New Category Name" />
                    </div>
                    <div class="col-md-6">
                      <select class="form-control" (change)="onBrandChange($event)" [ngModel]="selectedBrandId" name="brandSelect">
                        <option value="">Select Brand</option>
                        <option value="new">Add new...</option>
                        <option *ngFor="let brand of brands" [value]="brand.id">{{ brand.name }}</option>
                      </select>
                      <input *ngIf="showNewBrandInput" [(ngModel)]="model.brandName" name="brandName" class="form-control"
                        placeholder="New Brand Name" />
                      </div>
                    </div>


                    <div class="row g-3 mb-3">
                      <div class="col-md-6">
                        <label class="form-label">Category Slug (optional)</label>
                        <input [(ngModel)]="model.categorySlug" name="categorySlug" class="form-control"
                          placeholder="smartphones" />
                        </div>
                        <div class="col-md-6">
                          <label class="form-label">Brand Logo URL (optional)</label>
                          <input [(ngModel)]="model.brandLogoUrl" name="brandLogoUrl" class="form-control"
                            placeholder="https://..." />
                          </div>
                        </div>


                        <div class="mb-3">
                          <label class="form-label">Short Description</label>
                          <textarea [(ngModel)]="model.shortDescription" name="shortDesc" class="form-control" rows="2"
                          placeholder="Apple iPhone 16 with A18 Bionic chip..."></textarea>
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Full Description</label>
                          <textarea [(ngModel)]="model.description" name="desc" class="form-control" rows="4"
                          placeholder="The Apple iPhone 16 delivers next-level performance..."></textarea>
                        </div>


                        <div class="row g-3 mb-3">
                          <div class="col-md-6">
                            <label class="form-label">Price (₹) *</label>
                            <input [(ngModel)]="model.price" name="price" type="number" required min="1"
                              class="form-control" />
                            </div>
                            <div class="col-md-6">
                              <label class="form-label">Stock *</label>
                              <input [(ngModel)]="model.stockQuantity" name="stock" type="number" required min="1"
                                class="form-control" />
                              </div>
                            </div>


                            <div class="mb-3">
                              <label class="form-label">Images (select one or more)</label>
                              <input type="file" multiple accept="image/*" (change)="onFileChange($event)" class="form-control" />
                              <small class="text-muted">Uploaded to server → /uploads/products/</small>
                            </div>


                            <div class="mb-4">
                              <label class="form-label">Tags (comma-separated)</label>
                              <input [(ngModel)]="tagInput" name="tags" placeholder="mobile, 5g, premium" class="form-control" />
                            </div>


                            <div class="d-flex gap-2 justify-content-center">
                              <button type="submit" class="btn btn-primary btn-lg" [disabled]="uploading || !form.valid">
                                {{ uploading ? 'Uploading...' : 'Add Product' }}
                              </button>
                              <a [routerLink]="['/home']" class="btn btn-secondary btn-lg">Cancel</a>
                            </div>
                          </form>
                        </div>
                      </div>
                    </div>
                  </body>
                </html>
