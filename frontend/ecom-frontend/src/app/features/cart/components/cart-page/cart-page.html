<div class="container py-5">
  <div class="page-header mb-4">
    <h2 class="page-title">My Cart</h2>
    <p class="text-muted">Review and manage your selected items</p>
  </div>

  @if (store.itemCount() === 0) {
  <div class="empty-cart-state">
    <div class="empty-icon-wrapper">
      <i class="bi bi-cart-x"></i>
    </div>
    <h4>Your cart is empty</h4>
    <p class="text-muted mb-4">Looks like you haven't added anything to your cart yet.</p>
    <a routerLink="/" class="btn-shop-now">
      <i class="bi bi-arrow-left me-2"></i>
      Start Shopping
    </a>
  </div>
  }

  @if (store.itemCount() > 0) {
  <div class="row g-4">
    <div class="col-lg-8">
      <div class="cart-items-list">
        @for (item of store.cart().items; track item.productId) {
        <app-cart-item [item]="item"></app-cart-item>
        }
      </div>
    </div>
    <div class="col-lg-4">
      <div class="cart-sidebar">
        <app-cart-summary></app-cart-summary>
      </div>
    </div>
  </div>
  }
</div>
