<button class="btn btn-primary btn-sm w-100 d-flex align-items-center justify-content-center gap-2"
    (click)="addToCart()" [disabled]="loading()">
    <span class="spinner-border spinner-border-sm" role="status" *ngIf="loading()"></span>
    <i class="bi bi-cart-plus"></i>
    <span>Add to Cart</span>
</button>
