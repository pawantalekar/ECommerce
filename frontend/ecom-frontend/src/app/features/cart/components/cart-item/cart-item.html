<div class="cart-item-card">
  <div class="item-visual">
    <div class="item-image-wrapper">
      <img [src]="item.thumbnailUrl || 'https://via.placeholder.com/150'" class="item-image" alt="{{ item.name }}">
    </div>
  </div>

  <div class="item-content">
    <div class="item-header">
      <h6 class="item-title">
        <a routerLink="/catalog/products/{{ item.slug }}" class="item-link">
          {{ item.name }}
        </a>
      </h6>
      <button class="btn-remove" (click)="remove()" title="Remove item">
        <i class="bi bi-trash"></i>
      </button>
    </div>

    <div class="item-footer">
      <div class="quantity-controls">
        <button class="qty-btn" (click)="updateQuantity(item.quantity - 1)" [disabled]="item.quantity <= 1">
          <i class="bi bi-dash"></i>
        </button>
        <span class="qty-value">{{ item.quantity }}</span>
        <button class="qty-btn" (click)="updateQuantity(item.quantity + 1)">
          <i class="bi bi-plus"></i>
        </button>
        @if (loading()) {
        <div class="loading-spinner ms-2">
          <span class="spinner-border spinner-border-sm text-primary"></span>
        </div>
        }
      </div>

      <div class="item-price">
        <span class="price-label">Price</span>
        <span class="price-value">₹{{ item.price | number:'1.0-0' }}</span>
      </div>
    </div>
  </div>
</div>
