image: mcr.microsoft.com/dotnet/sdk:9.0

stages:
  - restore
  - build
  - test
  - publish
  - frontend-build

variables:
  BUILD_CONFIGURATION: "Release"
  SOLUTION_FILE: "backend/src/src.sln"

# ---------------- BACKEND ----------------
restore:
  stage: restore
  script:
    - dotnet restore $SOLUTION_FILE

build:
  stage: build
  script:
    - dotnet build $SOLUTION_FILE --configuration $BUILD_CONFIGURATION --no-restore

test:
  stage: test
  script:
    - dotnet test $SOLUTION_FILE --configuration $BUILD_CONFIGURATION --no-build --no-restore

publish:
  stage: publish
  script:
    - dotnet publish backend/src/Ecom.Gateway/Ecom.Gateway.csproj --configuration $BUILD_CONFIGURATION --output publish --no-build --no-restore
  artifacts:
    paths:
      - publish/

# ---------------- FRONTEND ----------------
frontend-build:
  stage: frontend-build
  image: node:20
  script:
    - cd frontend/ecom-frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/ecom-frontend/dist/